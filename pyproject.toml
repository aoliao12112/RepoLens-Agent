[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repolens-agent"
version = "0.1.0"
description = "Evidence-grounded technical due diligence agent for GitHub repositories"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite",
  "fastapi",
  "httpx",
  "openai-agents",
  "pydantic>=2",
  "pydantic-settings",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

